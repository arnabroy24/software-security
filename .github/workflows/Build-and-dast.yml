- name: Wait for Flask app to be ready (up to 15 mins)
  run: |
    echo "Waiting for Flask app to start..."
    # Wait for container to initialize
    sleep 30
    
    for i in {1..60}; do
      echo "Attempt $i: Checking container status..."
      docker ps -a | grep ghsa-container
      
      # Check if data processing has completed
      DATA_READY=$(docker exec ghsa-container bash -c "[ -f /app/data_ready ] && echo 'yes' || echo 'no'")
      echo "Data processing ready: $DATA_READY"
      
      # Try connecting to the Flask app
      HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 3 --retry-delay 2 http://localhost:5000/api/advisories/GHSA-vrq4-9hc3-cgp7 || echo "connection_failed")
      
      if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "404" ]; then
        echo "Flask app is ready (HTTP $HTTP_CODE)"
        exit 0
      fi
      
      echo "Response code: $HTTP_CODE"
      echo "Container logs (last 20 lines):"
      docker logs --tail 20 ghsa-container
      
      echo "Still waiting for app... attempt $i"
      sleep 10
    done
    
    echo "Flask app failed to start in time. Final container status:"
    docker ps -a | grep ghsa-container
    echo "Final container logs:"
    docker logs ghsa-container
