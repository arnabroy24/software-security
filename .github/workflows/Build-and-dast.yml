name: Deploy Flask App & Run ZAP

on:
  workflow_dispatch:

jobs:
  docker-zap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t ghsa-backend-app .

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name ghsa-container ghsa-backend-app

      - name: Wait for Flask app to be ready
        run: |
          echo "Waiting for Flask app..."
          for i in {1..10}; do
            curl -s http://localhost:5000/api/advisories/GHSA-vrq4-9hc3-cgp7 && break
            sleep 5
          done

      - name: Run ZAP full scan and generate report
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: 'http://localhost:5000/api/advisories/GHSA-vrq4-9hc3-cgp7'
          allow_issue_writing: false
          cmd_options: '-a -j -r zap-report.html'

      - name: Upload ZAP report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
