name: Socket OSS Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  socket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Socket OSS Scan
        uses: socketdev/action@v0.2.1
        with:
          github-token: ${{ secrets.GH_SOCKET_TOKEN }}
